<svg width="900" height="230" viewBox="0 0 900 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="60%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#06221c" />
    </linearGradient>

    <!-- Accent Emerald Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glow Gradients -->
    <radialGradient id="glowRight" cx="90%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowLeft" cx="15%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Blueprint Grid -->
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#334155" stroke-width="0.6" stroke-opacity="0.22" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="230" rx="14" fill="url(#bgGrad)" />
  <rect width="900" height="230" rx="14" fill="url(#grid)" />
  <rect width="900" height="230" rx="14" fill="url(#glowRight)" />
  <rect width="900" height="230" rx="14" fill="url(#glowLeft)" />

  <!-- Outer Border -->
  <rect x="0.75" y="0.75" width="898.5" height="228.5" rx="13.25" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Glowing Top Border Accent -->
  <path d="M 14 1 L 886 1" stroke="url(#emeraldGrad)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Decorative Network Visualization on Right -->
  <g transform="translate(740, 35)" opacity="0.65">
    <!-- Orbital Rings -->
    <circle cx="70" cy="75" r="55" stroke="#10b981" stroke-width="1" stroke-dasharray="3 3" fill="none" opacity="0.4" />
    <circle cx="70" cy="75" r="35" stroke="#06b6d4" stroke-width="1" stroke-dasharray="2 2" fill="none" opacity="0.5" />
    
    <!-- Nodes and Connections -->
    <line x1="70" y1="20" x2="105" y2="50" stroke="#34d399" stroke-width="1.2" opacity="0.6" />
    <line x1="105" y1="50" x2="85" y2="105" stroke="#34d399" stroke-width="1.2" opacity="0.6" />
    <line x1="85" y1="105" x2="35" y2="90" stroke="#06b6d4" stroke-width="1.2" opacity="0.6" />
    <line x1="35" y1="90" x2="70" y2="20" stroke="#06b6d4" stroke-width="1.2" opacity="0.6" />
    <line x1="70" y1="75" x2="70" y2="20" stroke="#10b981" stroke-width="1" opacity="0.7" />
    <line x1="70" y1="75" x2="105" y2="50" stroke="#10b981" stroke-width="1" opacity="0.7" />
    <line x1="70" y1="75" x2="85" y2="105" stroke="#10b981" stroke-width="1" opacity="0.7" />
    <line x1="70" y1="75" x2="35" y2="90" stroke="#10b981" stroke-width="1" opacity="0.7" />

    <circle cx="70" cy="75" r="5" fill="#10b981" />
    <circle cx="70" cy="20" r="3.5" fill="#38bdf8" />
    <circle cx="105" cy="50" r="3.5" fill="#34d399" />
    <circle cx="85" cy="105" r="3.5" fill="#38bdf8" />
    <circle cx="35" cy="90" r="3.5" fill="#34d399" />
  </g>

  <!-- Content Group -->
  <g transform="translate(45, 36)">
    <!-- Identifier Pill -->
    <g transform="translate(0, 0)">
      <rect width="185" height="24" rx="12" fill="#10b981" fill-opacity="0.14" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="12" cy="12" r="3.5" fill="#10b981" />
      <text x="24" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#34d399" letter-spacing="0.6">VALLDYNSYAH DANUARTA</text>
    </g>

    <!-- Main Headline -->
    <text x="0" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="27" font-weight="800" fill="#ffffff" letter-spacing="-0.3">
      Building Intelligent Systems &amp; Clean Software
    </text>

    <!-- Subtitle -->
    <text x="0" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#94a3b8">
      Mathematics Graduate @ ITS Surabaya <tspan fill="#475569">|</tspan> <tspan fill="#34d399" font-weight="600">Machine Learning</tspan> <tspan fill="#475569">•</tspan> <tspan fill="#38bdf8" font-weight="600">Computer Vision</tspan> <tspan fill="#475569">•</tspan> <tspan fill="#e2e8f0">Full-Stack</tspan>
    </text>

    <!-- Badges Row -->
    <g transform="translate(0, 118)">
      <!-- Badge 1: ITS Mathematics -->
      <g transform="translate(0, 0)">
        <rect width="138" height="28" rx="6" fill="#111827" stroke="#334155" stroke-width="1"/>
        <!-- Degree icon -->
        <path d="M 14 14 L 22 10 L 30 14 L 22 18 Z M 16 16.5 L 16 20 C 16 21.5 28 21.5 28 20 L 28 16.5" stroke="#38bdf8" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
        <text x="36" y="18.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">ITS Mathematics</text>
      </g>

      <!-- Badge 2: Bangkit Graduate -->
      <g transform="translate(148, 0)">
        <rect width="144" height="28" rx="6" fill="#111827" stroke="#334155" stroke-width="1"/>
        <!-- Rocket icon -->
        <path d="M 16 21 L 18 17 M 27 12 C 27 12 28 15 25 18 L 22 15 C 24 13 27 12 27 12 Z M 22 15 L 18 19 L 19 22 L 22 21 Z" stroke="#f59e0b" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
        <text x="34" y="18.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Bangkit ML Alumni</text>
      </g>

      <!-- Badge 3: Edge AI -->
      <g transform="translate(302, 0)">
        <rect width="146" height="28" rx="6" fill="#111827" stroke="#334155" stroke-width="1"/>
        <!-- Lightning icon -->
        <path d="M 22 8 L 16 16 L 21 16 L 19 23 L 26 14 L 21 14 Z" stroke="#34d399" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
        <text x="32" y="18.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Edge AI &amp; NanoDet</text>
      </g>

      <!-- Badge 4: valldy.my.id -->
      <g transform="translate(458, 0)">
        <rect width="134" height="28" rx="6" fill="#064e3b" fill-opacity="0.35" stroke="#10b981" stroke-width="1"/>
        <!-- Globe icon -->
        <circle cx="21" cy="14" r="6" stroke="#34d399" stroke-width="1.2" fill="none"/>
        <line x1="15" y1="14" x2="27" y2="14" stroke="#34d399" stroke-width="1.2"/>
        <ellipse cx="21" cy="14" rx="3" ry="6" stroke="#34d399" stroke-width="1.2" fill="none"/>
        <text x="34" y="18.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#34d399">valldy.my.id</text>
      </g>
    </g>
  </g>
</svg>
